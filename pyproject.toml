[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-systems-lab"
version = "0.3.0"
description = "A reproducible runtime and evaluation harness for tool-using agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yimin Xu"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
terminal-bench = ["harbor>=0.27,<0.28"]

[project.scripts]
asl = "agent_systems_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
